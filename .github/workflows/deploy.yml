name: CI/CD Pipeline - Build and Deploy (local)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t moja-demo-app:latest .
        docker tag moja-demo-app:latest moja-demo-app:${{ github.sha }}

    - name: Load image into Kind cluster
      run: |
        kind load docker-image moja-demo-app:latest --name moj-klaster

    - name: Deploy to Kind
      run: |
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml

    - name: Restart deployment
      run: |
        kubectl rollout restart deployment/moja-demo-app

    - name: Wait for rollout
      run: |
        kubectl rollout status deployment/moja-demo-app --timeout=120s

    - name: Show pod status
      run: |
        kubectl get pods
        kubectl get services