name: CI/CD Pipeline - Staging & Production

on:
  push:
    branches: [ "main" ]

jobs:
  # ============================================================
  # JOB 1: Build i učitavanje slike u kind
  # ============================================================
  build:
    name: Build & Load Image
    runs-on: self-hosted
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Docker image
      run: |
        docker build -t moja-demo-app:latest .
        docker tag moja-demo-app:latest moja-demo-app:${{ github.sha }}

    - name: Load image into Kind cluster
      run: |
        kind load docker-image moja-demo-app:latest --name moj-klaster

  # ============================================================
  # JOB 2: Deploy na STAGING (automatski, bez odobrenja)
  # ============================================================
  deploy-staging:
    name: Deploy to STAGING
    needs: build                    # Čeka da build uspe
    runs-on: self-hosted
    environment:
      name: staging                 # GitHub Environment "staging" (bez approval-a)
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to staging namespace
      run: |
        kubectl apply -k k8/overlays/staging/
        kubectl rollout restart deployment/moja-demo-app -n staging
        kubectl rollout status deployment/moja-demo-app -n staging --timeout=120s

    - name: Show staging status
      run: |
        kubectl get pods -n staging

  # ============================================================
  # JOB 3: Deploy na PRODUCTION (čeka RUČNO ODOBRENJE)
  # ============================================================
  deploy-production:
    name: Deploy to PRODUCTION
    needs: deploy-staging           # Čeka da staging uspe!
    runs-on: self-hosted
    environment:
      name: production              # GitHub Environment "production" (SA approval-om)
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to production namespace
      run: |
        kubectl apply -k k8/overlays/production/
        kubectl rollout restart deployment/moja-demo-app -n production
        kubectl rollout status deployment/moja-demo-app -n production --timeout=120s

    - name: Show production status
      run: |
        kubectl get pods -n production